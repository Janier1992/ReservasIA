<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agente con inteligencia artificial que atiende por WhatsApp y Telegram las 24 horas, y una app completa para gestionar reservas, ventas, caja, catálogo, clientes y reportes de tu negocio. Probalo gratis 14 días." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReservasIA" />
    <meta property="og:title" content="ReservasIA — Agente con IA y gestión completa para tu negocio" />
    <meta property="og:description" content="Tu negocio entero, en piloto automático: agente con IA en WhatsApp y Telegram y gestión completa en una sola app. Probalo gratis 14 días." />
    <meta property="og:url" content="https://reservas-ia-app.vercel.app/" />
    <meta property="og:image" content="https://reservas-ia-app.vercel.app/icons/icon-512.png" />
    <meta property="og:locale" content="es_CO" />
    <meta name="theme-color" content="#B4513A" />
    <!-- Google Search Console: prueba que el dominio es nuestro (verificación de la pantalla de consentimiento de Google). -->
    <meta name="google-site-verification" content="VmYzXUlGTr_UEoeEny_9aR8xDDoKb-60IborWtvJfVg" />

    <!-- iOS no lee el manifest.json para el modo "app instalada": necesita estas etiquetas explícitas.
         mobile-web-app-capable es el reemplazo estándar que ahora también pide Chrome/Android; se
         mantienen ambas porque Safari en iOS todavía sólo reconoce la de "apple-". -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReservasIA" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>ReservasIA — Agente con IA y gestión completa para tu negocio</title>

    <!-- Aplica el tema guardado (o la preferencia del sistema) ANTES de que
         React monte: evita el flash de tema claro cuando el usuario ya
         eligió oscuro. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
