name: Secretos

# Bloquea un PR si agrega una clave, token o contraseña al código (el
# repositorio es público: lo que se sube queda visible para siempre, aunque
# después se borre). Revisa todos los commits del PR, no solo el último.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Sin claves en el código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
