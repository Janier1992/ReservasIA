name: Deploy Edge Functions

# Publica las Edge Functions de functions/ en InsForge: en cada push a main,
# solo las afectadas por los archivos que cambiaron (scripts/changed-functions.mjs
# mira de qué archivos depende cada una: su propio .ts, functions/_shared/ o
# código del server que importa, como las instrucciones del agente en
# agent-preview). A mano: Actions → Deploy Edge Functions → Run workflow, con
# los nombres separados por espacio (vacío = todas). Necesita los secretos
# del repositorio INSFORGE_URL e INSFORGE_API_KEY (los mismos valores que usa
# el compute service en Railway).
on:
  push:
    branches: [main]
    paths: ["functions/**", "server/src/**", "scripts/function-bundle.mjs", "scripts/changed-functions.mjs"]
  workflow_dispatch:
    inputs:
      functions:
        description: "Funciones a publicar, separadas por espacio (vacío = todas)"
        required: false
        default: ""

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: un push puede traer varios commits y hay que
          # comparar contra el estado anterior al push, no solo el último commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # esbuild, para empaquetar las funciones que importan código del repo.
      - run: npm ci
      - name: Elegir funciones
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            # Todo lo que trajo el push (BEFORE..HEAD); si no hay estado anterior, el último commit.
            base="$BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
            # Sin comillas a propósito: un argumento por archivo cambiado.
            changed=$(node scripts/changed-functions.mjs $(git diff --name-only "$base" HEAD))
            echo "Funciones afectadas: ${changed:-ninguna}"
            echo "slugs=$changed" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar en InsForge
        if: github.event_name == 'workflow_dispatch' || steps.pick.outputs.slugs != ''
        env:
          INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
          SLUGS: ${{ steps.pick.outputs.slugs }}
        # $SLUGS sin comillas a propósito: un argumento por función.
        run: node scripts/deploy-functions-api.mjs $SLUGS
