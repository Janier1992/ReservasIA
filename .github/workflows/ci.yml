name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: |
          npx tsc --noEmit -p app
          npx tsc --noEmit -p server
      - run: npm test
      # El build del frontend exige estas variables (lib/env.ts); valores de
      # relleno: acá solo se valida que compile, no se despliega.
      - run: npm run build
        env:
          VITE_INSFORGE_URL: https://ci.invalid
          VITE_INSFORGE_ANON_KEY: ci-placeholder
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migraciones y tests de RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
