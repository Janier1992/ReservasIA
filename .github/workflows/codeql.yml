name: CodeQL

# Análisis de seguridad del código (inyecciones, XSS, secretos en código,
# validaciones faltantes...) en cada PR, en cada push a main y una vez por
# semana con las reglas más recientes. Los hallazgos quedan en la pestaña
# Security del repositorio y en el PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Análisis de seguridad (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
